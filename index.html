<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="William Cannell's portfolio of photogrammetry, equipment, and 3D CGI work.">
  <meta name="theme-color" content="#111416">
  <title>William Cannell &mdash; Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111416'/%3E%3Cpath d='M13 42 25 20l8 14 6-10 12 18H13Z' fill='none' stroke='%23f2f5f4' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='45' cy='18' r='4' fill='%239fc9c3'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="assets/thumbs/photogrammetry-03.jpg">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="#top" aria-label="Portfolio home">Portfolio</a>
    <nav aria-label="Portfolio sections">
      <a href="#photogrammetry">Photogrammetry</a>
      <a href="#gear">Gear</a>
      <a href="#cgi">3D CGI</a>
    </nav>
  </header>

  <main id="top">
    <section class="intro" aria-labelledby="intro-title">
      <h1 id="intro-title">William Cannell</h1>
      <p>Business Management Bachelor&rsquo;s Student<br><span>Tallahassee State College</span><br><span>FAA Part 107 licensed</span><br><a href="tel:+13056197298">Phone: 305-619-7298</a></p>
    </section>

    <section class="portfolio-section" id="photogrammetry">
      <div class="section-heading">
        <h2>Photogrammetry</h2>
        <span>04</span>
      </div>
      <div class="gallery gallery-photogrammetry">
        <button class="gallery-item feature" type="button" data-full="assets/full/photogrammetry-03.jpg" aria-label="View photogrammetry reconstruction larger">
          <img src="assets/thumbs/photogrammetry-03.jpg" alt="Photogrammetry reconstruction of an outdoor residential area" width="900" height="496" fetchpriority="high">
        </button>
        <button class="gallery-item wide" type="button" data-full="assets/full/photogrammetry-01.jpg" aria-label="View photogrammetry model larger">
          <img src="assets/thumbs/photogrammetry-01.jpg" alt="Wide photogrammetry model shown in 3D software" width="900" height="324" loading="lazy">
        </button>
        <button class="gallery-item wide" type="button" data-full="assets/full/photogrammetry-02.jpg" aria-label="View second photogrammetry model larger">
          <img src="assets/thumbs/photogrammetry-02.jpg" alt="Second view of a wide photogrammetry model" width="900" height="382" loading="lazy">
        </button>
        <button class="gallery-item square" type="button" data-full="assets/full/photogrammetry-capture.jpg" aria-label="View capture visualization larger">
          <img src="assets/thumbs/photogrammetry-capture.jpg" alt="Colored spherical capture displayed in 3D software" width="658" height="655" loading="lazy">
        </button>
      </div>
    </section>

    <section class="portfolio-section" id="gear">
      <div class="section-heading">
        <h2>Gear</h2>
        <span>01</span>
      </div>
      <div class="gallery gallery-gear">
        <button class="gallery-item" type="button" data-full="assets/full/gear-3527.jpg" aria-label="View equipment image larger">
          <img src="assets/thumbs/gear-3527.jpg" alt="Camera, drone, controllers, lenses, and field equipment" width="900" height="675" loading="lazy">
        </button>
      </div>
    </section>

    <section class="portfolio-section" id="cgi">
      <div class="section-heading">
        <h2>3D CGI</h2>
        <span>10</span>
      </div>
      <div class="gallery gallery-cgi">
        <button class="gallery-item feature" type="button" data-full="assets/full/ticonderoga-perspective-01.jpg" aria-label="View ship model larger">
          <img src="assets/thumbs/ticonderoga-perspective-01.jpg" alt="Perspective view of a detailed 3D ship model" width="900" height="673" loading="lazy">
        </button>
        <button class="gallery-item square" type="button" data-full="assets/full/ticonderoga-perspective-02.jpg" aria-label="View second ship model larger">
          <img src="assets/thumbs/ticonderoga-perspective-02.jpg" alt="Elevated perspective view of a 3D ship model" width="789" height="789" loading="lazy">
        </button>
        <button class="gallery-item wide" type="button" data-full="assets/full/ticonderoga-interior-01.jpg" aria-label="View modeled interior larger">
          <img src="assets/thumbs/ticonderoga-interior-01.jpg" alt="Work-in-progress 3D model of a ship interior" width="900" height="549" loading="lazy">
        </button>
        <button class="gallery-item wide" type="button" data-full="assets/full/ticonderoga-interior-02.jpg" aria-label="View second modeled interior larger">
          <img src="assets/thumbs/ticonderoga-interior-02.jpg" alt="Second view of a work-in-progress ship interior model" width="900" height="591" loading="lazy">
        </button>
        <button class="gallery-item wide" type="button" data-full="assets/full/ticonderoga-wireframe.jpg" aria-label="View ship wireframe larger">
          <img src="assets/thumbs/ticonderoga-wireframe.jpg" alt="Side elevation wireframe of a ship model" width="900" height="420" loading="lazy">
        </button>
        <button class="gallery-item wide" type="button" data-full="assets/full/ticonderoga-profile.jpg" aria-label="View ship profile larger">
          <img src="assets/thumbs/ticonderoga-profile.jpg" alt="Side profile of a ship model in 3D software" width="900" height="421" loading="lazy">
        </button>
        <button class="gallery-item" type="button" data-full="assets/full/ticonderoga-props-01.jpg" aria-label="View modeled deck equipment larger">
          <img src="assets/thumbs/ticonderoga-props-01.jpg" alt="Modeled equipment on the deck of a ship" width="620" height="471" loading="lazy">
        </button>
        <button class="gallery-item" type="button" data-full="assets/full/ticonderoga-props-02.jpg" aria-label="View second modeled deck detail larger">
          <img src="assets/thumbs/ticonderoga-props-02.jpg" alt="Second view of modeled ship deck equipment" width="682" height="547" loading="lazy">
        </button>
        <button class="gallery-item" type="button" data-full="assets/full/environment-imported-map.jpg" aria-label="View imported 3D environment larger">
          <img src="assets/thumbs/environment-imported-map.jpg" alt="Imported environment in 3D software" width="900" height="786" loading="lazy">
        </button>
        <button class="gallery-item video-item" type="button" data-video="assets/video/environment-weather.mp4" data-poster="assets/thumbs/environment-weather.jpg" aria-label="Play 3D environment weather effects">
          <img src="assets/thumbs/environment-weather.jpg" alt="Weather effects in an imported 3D environment" width="900" height="1956" loading="lazy">
        </button>
      </div>
    </section>
  </main>

  <footer><a href="#top" aria-label="Back to top">William Cannell</a></footer>

  <dialog class="lightbox" aria-label="Media viewer">
    <button class="lightbox-close" type="button" aria-label="Close media viewer">Close</button>
    <button class="lightbox-nav lightbox-previous" type="button">Previous</button>
    <figure>
      <img src="" alt="">
      <video controls playsinline preload="metadata" hidden></video>
    </figure>
    <button class="lightbox-nav lightbox-next" type="button">Next</button>
  </dialog>
</body>
</html>
